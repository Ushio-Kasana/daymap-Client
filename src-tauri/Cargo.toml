[package]
name = "daymap-tauri"
version = "0.1.4"
description = "A fast, unofficial desktop client for Daymap"
authors = ["Daymap Client contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daymap_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "rt", "time", "fs", "io-util"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["block2"] }
