name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish these builds to a GitHub release with this tag (for example v0.1.0). Leave empty to only build artifacts."
        required: false
        type: string
  push:
    branches:
      - main
      - testing
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release notes
        if: env.RELEASE_TAG != ''
        id: release_notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="$(awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1 }
            capture && /^## \[/ && index($0, "## [" version "]") != 1 { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for ${RELEASE_TAG}."
            exit 1
          fi
          {
            echo "body<<DAYMAP_RELEASE_NOTES_EOF"
            printf '%s\n' "$notes"
            echo "DAYMAP_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri skips its Finder layout on CI by default. Keep it enabled so
          # the custom DMG background, icon positions and 128 px icons are applied.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Daymap {0}', env.RELEASE_TAG) || '' }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          uploadWorkflowArtifacts: true
          retryAttempts: 2
