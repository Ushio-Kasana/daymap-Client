name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish these builds to a GitHub release with this tag (for example v0.1.0). Leave empty to only build artifacts."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri skips its Finder layout on CI by default. Keep it enabled so
          # the custom DMG background, icon positions and 128 px icons are applied.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Daymap {0}', env.RELEASE_TAG) || '' }}
          releaseBody: |
            Installers for this release. See the repository CHANGELOG.md for the full notes.
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          retryAttempts: 2
