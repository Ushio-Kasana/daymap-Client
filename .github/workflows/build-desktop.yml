name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish these builds to a GitHub release with this tag (for example v0.1.0). Leave empty to only build artifacts."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: daymap-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Show release assets
        run: ls -l assets

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
