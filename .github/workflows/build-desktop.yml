name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish these builds to a GitHub release with this tag (for example v0.1.0). Leave empty to only build artifacts."
        required: false
        type: string
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: Windows 32-bit
            os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # The certificate is self-signed, so Gatekeeper still warns on first launch.
      # It keeps the app signature stable across releases so the saved-session
      # keychain item can be allowed once and then reused.
      - name: Import macOS signing certificate
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          keychain="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import certificate.p12 -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          rm -f certificate.p12

      - name: Prepare release notes
        if: env.RELEASE_TAG != ''
        id: release_notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="$(awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1 }
            capture && /^## \[/ && index($0, "## [" version "]") != 1 { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for ${RELEASE_TAG}."
            exit 1
          fi
          {
            echo "body<<DAYMAP_RELEASE_NOTES_EOF"
            printf '%s\n' "$notes"
            echo "DAYMAP_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && 'Daymap Local Signing' || '' }}
          # Tauri skips its Finder layout on CI by default. Keep it enabled so
          # the custom DMG background, icon positions and 128 px icons are applied.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Daymap {0}', env.RELEASE_TAG) || '' }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          uploadWorkflowArtifacts: true
          retryAttempts: 2
          args: --target ${{ matrix.target }}
